services:
  projet-data:
    build: .
    container_name: projet-data-pipeline

    env_file:
      - .env

    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=eu-north-1

    volumes:
      - .:/app

    command: python scripts/main.py